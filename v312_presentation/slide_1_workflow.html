<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap');
        
        :root {
            --bg-dark: #0f172a;
            --bg-panel: #1e293b;
            --accent-orange: #f97316;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        
        .slide-container {
            width: 1280px;
            min-height: 720px;
            max-height: 720px;
            background: var(--bg-dark);
            color: var(--text-main);
            display: flex;
            position: relative;
            overflow: hidden;
        }

        .left-content {
            flex: 1;
            padding: 80px 80px 0 80px; /* Reduced top padding, removed bottom padding */
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            z-index: 2;
        }

        .version-badge {
            display: inline-block;
            background: rgba(249, 115, 22, 0.15);
            color: var(--accent-orange);
            padding: 8px 16px;
            border-radius: 20px;
            font-weight: 600;
            font-size: 1.1rem;
            margin-bottom: 20px;
            width: fit-content;
            border: 1px solid rgba(249, 115, 22, 0.3);
        }

        h1 {
            font-size: 4rem;
            font-weight: 800;
            line-height: 1.1;
            margin-bottom: 20px;
            letter-spacing: -0.02em;
        }

        h2 {
            font-size: 2rem;
            font-weight: 300;
            color: var(--text-muted);
            margin-bottom: 40px;
            line-height: 1.3;
        }

        .presenter {
            margin-top: 16px;
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .presenter-icon {
            width: 48px;
            height: 48px;
            background: var(--bg-panel);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--accent-orange);
            font-size: 1.5rem;
        }

        .presenter-text {
            font-size: 1.2rem;
            font-weight: 600;
            color: var(--text-muted);
        }

        .right-visual {
            flex: 0.8;
            background: var(--bg-panel);
            position: relative;
            clip-path: polygon(15% 0, 100% 0, 100% 100%, 0% 100%);
        }

        .abstract-airfoil {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-40%, -50%);
            width: 600px;
            height: 200px;
            border-top: 4px solid var(--accent-orange);
            border-bottom: 2px solid rgba(249, 115, 22, 0.3);
            border-radius: 50% 100% 10% 40% / 80% 80% 20% 20%;
            box-shadow: inset 0 20px 40px rgba(249, 115, 22, 0.05);
        }

        .grid-overlay {
            position: absolute;
            inset: 0;
            background-image: 
                linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
            background-size: 40px 40px;
            opacity: 0.5;
        }

        .workflow-nodes {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-40%, -50%);
            width: 600px;
            display: flex;
            justify-content: space-between;
        }

        .node {
            width: 16px;
            height: 16px;
            background: var(--bg-dark);
            border: 3px solid var(--accent-orange);
            border-radius: 50%;
            box-shadow: 0 0 15px var(--accent-orange);
        }
    </style>
</head>
<body>
    <div class="slide-container">
        <div class="left-content">
            <div class="version-badge">Release v3.1.2</div>
            <h1>NACA Airfoil Kit Pro</h1>
            <h2>A Workflow, Not Just a Generator.<br>From geometry to reproducible decisions.</h2>
            <div class="presenter">
                <div class="presenter-icon"><i class="fas fa-users-cog"></i></div>
                <div class="presenter-text">Product &amp; Engineering Team</div>
            </div>
        </div>
        <div class="right-visual">
            <div class="grid-overlay"></div>
            <div class="abstract-airfoil"></div>
            <div class="workflow-nodes">
                <div class="node" style="transform: translateY(-20px)"></div>
                <div class="node" style="transform: translateY(-40px)"></div>
                <div class="node" style="transform: translateY(-10px)"></div>
                <div class="node" style="transform: translateY(10px)"></div>
            </div>
        </div>
    </div>
</body>
</html>
