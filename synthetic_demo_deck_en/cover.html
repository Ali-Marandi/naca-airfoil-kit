<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .slide-container {
            width: 1280px;
            min-height: 720px;
            background-color: #08111f;
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: #f8fafc;
        }
        .bg-shape-1 {
            position: absolute;
            top: -200px;
            left: -200px;
            width: 800px;
            height: 800px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(239,68,68,0.1) 0%, rgba(8,17,31,0) 70%);
            z-index: 1;
        }
        .bg-shape-2 {
            position: absolute;
            bottom: -300px;
            right: -100px;
            width: 1000px;
            height: 600px;
            border-radius: 50%;
            background: radial-gradient(ellipse, rgba(56,189,248,0.08) 0%, rgba(8,17,31,0) 70%);
            z-index: 1;
        }
        .content-wrapper {
            z-index: 10;
            text-align: center;
            max-width: 1000px;
        }
        .warning-badge {
            display: inline-flex;
            align-items: center;
            background-color: rgba(239,68,68,0.15);
            color: #fca5a5;
            padding: 10px 28px;
            border-radius: 4px;
            font-size: 18px;
            font-weight: 700;
            letter-spacing: 2px;
            margin-bottom: 40px;
            border: 2px solid #ef4444;
            text-transform: uppercase;
        }
        .warning-badge i {
            margin-right: 12px;
            font-size: 24px;
        }
        .title {
            font-size: 64px;
            font-weight: 800;
            color: #ffffff;
            margin-bottom: 24px;
            line-height: 1.2;
        }
        .title span {
            color: #38bdf8;
        }
        .subtitle {
            font-size: 32px;
            color: #cbd5e1;
            font-weight: 400;
            margin-bottom: 60px;
            line-height: 1.5;
        }
        .footer-note {
            position: absolute;
            bottom: 40px;
            font-size: 16px;
            color: #ef4444;
            font-weight: 600;
            letter-spacing: 1px;
            text-transform: uppercase;
        }
        .divider {
            width: 120px;
            height: 4px;
            background: linear-gradient(90deg, #ef4444, #f97316);
            margin: 0 auto 40px;
            border-radius: 2px;
        }
    </style>
</head>
<body>
    <div class="slide-container">
        <div class="bg-shape-1"></div>
        <div class="bg-shape-2"></div>

        <div class="content-wrapper">
            <div class="warning-badge">
                <i class="fas fa-exclamation-triangle"></i>
                Synthetic Demonstration
            </div>
            <h1 class="title">NACA Airfoil Kit <span>Pro</span></h1>
            <div class="divider"></div>
            <h2 class="subtitle">Illustrative discovery pipeline only.<br><strong>Not customer evidence.</strong></h2>
        </div>

        <div class="footer-note">SYNTHETIC DEMO — NOT CUSTOMER EVIDENCE</div>
    </div>
</body>
</html>
