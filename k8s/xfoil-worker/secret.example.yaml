# Apply a real secret through the cluster secret manager or:
# kubectl -n naca-xfoil create secret generic xfoil-worker-api-key \
#   --from-literal=api-key="replace-with-a-long-random-value"
apiVersion: v1
kind: Secret
metadata:
  name: xfoil-worker-api-key
  namespace: naca-xfoil
  labels:
    app.kubernetes.io/name: xfoil-worker
    app.kubernetes.io/part-of: naca-airfoil-kit
type: Opaque
stringData:
  api-key: REPLACE_WITH_A_RUNTIME_MANAGED_SECRET
