apiVersion: v1
kind: Pod
metadata:
  name: xfoil-allowed-client
  namespace: naca-xfoil-network-test
  labels:
    naca-airfoil-kit/xfoil-client: "true"
    app.kubernetes.io/name: xfoil-network-test-client
spec:
  restartPolicy: Never
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: curl
      image: curlimages/curl:8.10.1
      command: ["sleep", "3600"]
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: ["ALL"]
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          cpu: 100m
          memory: 64Mi
---
