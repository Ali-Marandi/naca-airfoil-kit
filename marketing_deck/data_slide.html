<!DOCTYPE html>
<html lang="en">
<head>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
    <style>
      body { margin: 0; }
      .slide-container {
        width: 1280px;
        min-height: 720px; /* keep as required */
        box-sizing: border-box;
        background-color: #F0F4F8;
        background-image: radial-gradient(#829AB1 0.5px, transparent 0.5px);
        background-size: 10px 10px;
        font-family: 'Segoe UI', sans-serif;
        color: #334E68;
        margin-top: -1px; /* shift up 1px so total page height is 719px (<720) */
      }
      .header-block {
        padding-top: 40px; /* do not change - title padding must be preserved */
        margin-left: 60px;
      }
      h2 {
        font-family: 'Arial Black', sans-serif;
        font-weight: 900;
        font-size: 56px;
        color: #102A43;
        text-transform: uppercase;
        margin: 0;
      }
      .feature-grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 24px; /* slightly tightened spacing */
        padding-top: 32px; /* small reduction to compact layout */
        margin-left: 60px;
        margin-right: 60px;
      }
      .feature-card {
        border: 2px solid #102A43;
        padding-top: 20px; /* small inner padding reduction */
        padding-left: 16px;
        padding-right: 16px;
        clip-path: polygon(15px 0, 100% 0, 100% calc(100% - 15px), calc(100% - 15px) 100%, 0 100%, 0 15px);
        background: white;
        text-align: center;
        min-height: 320px; /* reduced from 350 to compact layout without changing fonts */
      }
      .feature-card i {
        font-size: 60px;
        color: #0078d4;
        margin-bottom: 16px;
      }
      .feature-card h3 {
        font-family: 'Arial Black', sans-serif;
        font-size: 24px;
        color: #102A43;
        margin-bottom: 12px;
        text-transform: uppercase;
      }
      .feature-card p {
        font-family: 'Courier New', Courier, monospace;
        font-size: 18px;
        line-height: 1.4;
      }
    </style>
</head>
<body>
    <div class="slide-container">
        <div class="header-block">
            <h2>Massive Data Integration</h2>
        </div>
        <div class="feature-grid">
            <div class="feature-card">
                <i class="fas fa-database"></i>
                <h3>1,600+ Profiles</h3>
                <p>Complete UIUC Airfoil Database integrated directly into the platform.</p>
            </div>
            <div class="feature-card">
                <i class="fas fa-search"></i>
                <h3>Smart Search</h3>
                <p>Find industry-standard profiles like Clark Y, Eppler, and Wortmann in seconds.</p>
            </div>
            <div class="feature-card">
                <i class="fas fa-layer-group"></i>
                <h3>NACA Series</h3>
                <p>Full support for NACA 4, 5, and 6-digit series generation and analysis.</p>
            </div>
        </div>
    </div>
</body>
</html>
