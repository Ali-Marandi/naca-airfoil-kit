<!DOCTYPE html>
<html lang="en">
<head>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
    <style>
      body { margin: 0; }
      .slide-container {
        width: 1280px;
        min-height: 720px;
        box-sizing: border-box;
        background-color: #F0F4F8;
        background-image: radial-gradient(#829AB1 0.5px, transparent 0.5px);
        background-size: 10px 10px;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        font-family: 'Segoe UI', sans-serif;
      }
      .closing-block {
        border: 2px solid #102A43;
        background: rgba(240, 244, 248, 0.95);
        padding-top: 60px;
        padding-left: 60px;
        padding-right: 60px;
        clip-path: polygon(30px 0, 100% 0, 100% calc(100% - 30px), calc(100% - 30px) 100%, 0 100%, 0 30px);
        text-align: center;
        max-width: 1000px;
        min-height: 400px;
      }
      h2 {
        font-family: 'Arial Black', sans-serif;
        font-weight: 900;
        font-size: 72px;
        color: #102A43;
        margin-bottom: 10px;
        text-transform: uppercase;
      }
      .sub-header {
        font-family: 'Courier New', Courier, monospace;
        font-weight: 400;
        font-size: 36px;
        color: #334E68;
        margin-bottom: 40px;
      }
      .repo-link {
        display: inline-block;
        border: 2px dashed #829AB1;
        padding-top: 20px;
        padding-left: 30px;
        padding-right: 30px;
        font-family: 'Courier New', Courier, monospace;
        font-size: 24px;
        color: #0078d4;
        background: white;
        margin-top: 20px;
      }
      .repo-link i {
        margin-right: 15px;
      }
      .footer-note {
        margin-top: 50px;
        font-family: 'Courier New', Courier, monospace;
        font-size: 18px;
        color: #829AB1;
        text-transform: uppercase;
        letter-spacing: 2px;
      }
    </style>
</head>
<body>
    <div class="slide-container">
        <div class="closing-block">
            <h2>Elevate Your Engineering</h2>
            <div class="sub-header">NACA Airfoil Kit Pro</div>
            <div class="repo-link">
                <i class="fab fa-github"></i>
                github.com/Ali-Marandi/naca-airfoil-kit
            </div>
            <div class="footer-note">Engineering Excellence • 2026</div>
        </div>
    </div>
</body>
</html>
