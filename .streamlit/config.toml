[server]
headless = true

[browser]
gatherUsageStats = false

[theme]
base = "dark"
primaryColor = "#0078D4"
backgroundColor = "#1E1E1E"
secondaryBackgroundColor = "#2D2D2D"
textColor = "#E0E0E0"
font = "sans serif"

[client]
toolbarMode = "minimal"
showErrorDetails = true

[runner]
fastReruns = true

[logger]
level = "info"
